<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulse-gradient-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pulse-gradient-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Nodes, Flows, Pulses) -->
  <g opacity="0.45">
    <!-- Animated Path Connections -->
    <path d="M 100 80 Q 300 20 600 80 T 1100 80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M 50 320 Q 400 380 700 310 T 1150 330" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="7s" repeatCount="indefinite" />
    </path>
    <path d="M 150 200 C 350 120 850 280 1050 200" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" from="120" to="0" dur="9s" repeatCount="indefinite" />
    </path>

    <!-- Animated Glowing Message Packets (Nodes moving along lines) -->
    <circle r="6" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 100 80 Q 300 20 600 80 T 1100 80" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle r="7" fill="#f43f5e" filter="url(#glow)">
      <animateMotion path="M 50 320 Q 400 380 700 310 T 1150 330" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle r="5" fill="#34d399" filter="url(#glow)">
      <animateMotion path="M 150 200 C 350 120 850 280 1050 200" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Pulsing Background Node Orbs -->
    <circle cx="150" cy="80" r="16" fill="url(#pulse-gradient-1)">
      <animate attributeName="r" values="12;20;12" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="200" r="22" fill="url(#pulse-gradient-2)">
      <animate attributeName="r" values="18;28;18" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="310" r="14" fill="url(#pulse-gradient-1)">
      <animate attributeName="r" values="10;18;10" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND LAYER - UNTOUCHED, LEGIBLE & CRISP TEXT (Highest Z-Index) -->
  <g filter="url(#soft-shadow)">
    <!-- Top Badge / Header pill -->
    <g transform="translate(435, 48)">
      <rect x="0" y="0" width="330" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="20" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">
        MANAGED MESSAGE BROKER ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#text-gradient)" letter-spacing="-0.5">
      Awesome Managed Message Broker
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated List of SaaS Platforms, Cloud Event Brokers &amp; Open-Source Messaging Engines
    </text>

    <!-- Protocol Badges / Pills Row -->
    <g transform="translate(600, 245)">
      <!-- Pub/Sub -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="115" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="57" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Pub / Sub</text>
      </g>
      <!-- AMQP / RabbitMQ -->
      <g transform="translate(-230, 0)">
        <rect x="0" y="0" width="135" height="36" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.2"/>
        <text x="67" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fb923c">🐰 AMQP &amp; Rabbit</text>
      </g>
      <!-- Kafka / Event Streaming -->
      <g transform="translate(-80, 0)">
        <rect x="0" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
        <text x="80" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#818cf8">🚀 Kafka &amp; Streaming</text>
      </g>
      <!-- MQTT IoT -->
      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="125" height="36" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
        <text x="62" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#34d399">📡 MQTT &amp; IoT</text>
      </g>
      <!-- Enterprise JMS -->
      <g transform="translate(235, 0)">
        <rect x="0" y="0" width="125" height="36" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
        <text x="62" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🏢 Enterprise JMS</text>
      </g>
    </g>

    <!-- Footer Stats / Meta Line -->
    <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748b">
      Enterprise SaaS &bull; Self-Hosted Open-Source &bull; Cloud Native &bull; Updated 2026
    </text>
  </g>
</svg>
