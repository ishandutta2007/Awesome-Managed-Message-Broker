<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Background Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.25"/>
    </pattern>

    <style>
      .dash-flow-1 {
        stroke-dasharray: 8 8;
        animation: flow1 6s linear infinite;
      }
      .dash-flow-2 {
        stroke-dasharray: 6 6;
        animation: flow2 8s linear infinite;
      }
      .pulse-node-1 {
        animation: pulse1 3s ease-in-out infinite alternate;
      }
      .pulse-node-2 {
        animation: pulse2 4s ease-in-out infinite alternate;
      }
      .live-dot {
        animation: blink 2s ease-in-out infinite;
      }

      @keyframes flow1 {
        from { stroke-dashoffset: 160; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flow2 {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 140; }
      }
      @keyframes pulse1 {
        from { r: 10px; opacity: 0.3; }
        to { r: 22px; opacity: 0.8; }
      }
      @keyframes pulse2 {
        from { r: 14px; opacity: 0.4; }
        to { r: 28px; opacity: 0.85; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#grid-pattern)"/>

  <!-- DYNAMIC NETWORK DATA FLOW ANIMATIONS (BACKGROUND LAYER) -->
  <g opacity="0.6">
    <!-- Flow Lines -->
    <path d="M 80 90 Q 300 20 600 80 T 1120 90" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-flow-1"/>
    <path d="M 60 320 Q 400 380 750 310 T 1140 320" fill="none" stroke="#818cf8" stroke-width="2" class="dash-flow-2"/>
    <path d="M 140 200 C 350 110 850 290 1060 200" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="10 10" class="dash-flow-1"/>

    <!-- Dynamic Pulsing Network Nodes -->
    <circle cx="150" cy="90" r="14" fill="#38bdf8" class="pulse-node-1"/>
    <circle cx="150" cy="90" r="6" fill="#38bdf8"/>

    <circle cx="1060" cy="200" r="18" fill="#f43f5e" class="pulse-node-2"/>
    <circle cx="1060" cy="200" r="8" fill="#f43f5e"/>

    <circle cx="900" cy="310" r="12" fill="#34d399" class="pulse-node-1"/>
    <circle cx="900" cy="310" r="5" fill="#34d399"/>
  </g>

  <!-- FOREGROUND LAYER - CRISP & READABLE UI & TEXT -->
  <g>
    <!-- Top Status Badge -->
    <g transform="translate(410, 42)">
      <rect x="0" y="0" width="380" height="34" rx="17" fill="url(#card-bg)" stroke="#475569" stroke-width="1.5"/>
      <circle cx="22" cy="17" r="5" fill="#10b981" class="live-dot"/>
      <text x="38" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="0.6">
        MANAGED MESSAGE BROKER ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">
      Awesome Managed Message Broker
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Directory of SaaS Platforms, Cloud Event Brokers &amp; Open-Source Messaging Engines
    </text>

    <!-- Protocol Cards / Pills Row -->
    <g transform="translate(600, 245)">
      <!-- Pub/Sub -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="120" height="38" rx="10" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="60" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">⚡ Pub / Sub</text>
      </g>
      <!-- AMQP / RabbitMQ -->
      <g transform="translate(-225, 0)">
        <rect x="0" y="0" width="140" height="38" rx="10" fill="url(#card-bg)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="70" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fb923c">🐰 AMQP &amp; Rabbit</text>
      </g>
      <!-- Kafka / Event Streaming -->
      <g transform="translate(-70, 0)">
        <rect x="0" y="0" width="160" height="38" rx="10" fill="url(#card-bg)" stroke="#818cf8" stroke-width="1.5"/>
        <text x="80" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#818cf8">🚀 Kafka &amp; Streaming</text>
      </g>
      <!-- MQTT IoT -->
      <g transform="translate(105, 0)">
        <rect x="0" y="0" width="125" height="38" rx="10" fill="url(#card-bg)" stroke="#34d399" stroke-width="1.5"/>
        <text x="62.5" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#34d399">📡 MQTT &amp; IoT</text>
      </g>
      <!-- Enterprise JMS -->
      <g transform="translate(245, 0)">
        <rect x="0" y="0" width="130" height="38" rx="10" fill="url(#card-bg)" stroke="#c084fc" stroke-width="1.5"/>
        <text x="65" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c084fc">🏢 Enterprise JMS</text>
      </g>
    </g>

    <!-- Footer Stats / Meta Line -->
    <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" fill="#64748b">
      Enterprise SaaS &bull; Self-Hosted Open-Source &bull; Cloud Native &bull; Updated 2026
    </text>
  </g>
</svg>
