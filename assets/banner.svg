<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter for foreground/text readability -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <style>
    /* Dynamic animated pulses and movement strictly in background/lower layer */
    @keyframes pulseParticle {
      0% { r: 3px; opacity: 0.3; }
      50% { r: 7px; opacity: 0.9; }
      100% { r: 3px; opacity: 0.3; }
    }

    @keyframes dashMove {
      to {
        stroke-dashoffset: -40;
      }
    }

    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .message-flow {
      stroke-dasharray: 8 8;
      animation: dashMove 2s linear infinite;
    }

    .node-pulse-1 { animation: pulseParticle 3s ease-in-out infinite; }
    .node-pulse-2 { animation: pulseParticle 4s ease-in-out infinite 1s; }
    .node-pulse-3 { animation: pulseParticle 3.5s ease-in-out infinite 0.5s; }

    .floating-card {
      animation: floatSlow 6s ease-in-out infinite;
    }
  </style>

  <!-- Base Dark Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.08">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- DYNAMIC BACKGROUND ELEMENTS (Positioned to sides/bottom, keeping main text clean) -->

  <!-- Message Broker Connections & Flow (Left Side Visuals) -->
  <g opacity="0.4">
    <!-- Left Publisher Node -->
    <circle cx="120" cy="100" r="28" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="120" y="105" text-anchor="middle" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">PUB</text>
    
    <!-- Central Broker Queue Node -->
    <rect x="80" y="270" width="100" height="50" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="130" y="300" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">QUEUE</text>

    <!-- Connectors -->
    <path d="M 120 128 L 130 270" stroke="#3b82f6" stroke-width="2" class="message-flow" />
    <circle cx="125" cy="199" fill="#60a5fa" class="node-pulse-1" />
  </g>

  <!-- Right Side Visuals (Subscribers & Topics) -->
  <g opacity="0.4">
    <rect x="1020" y="90" width="100" height="50" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <text x="1070" y="120" text-anchor="middle" fill="#f472b6" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">TOPIC</text>

    <circle cx="1070" cy="300" r="28" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="1070" y="305" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">SUB</text>

    <path d="M 1070 140 L 1070 272" stroke="#ec4899" stroke-width="2" class="message-flow" />
    <circle cx="1070" cy="206" fill="#f472b6" class="node-pulse-2" />
  </g>

  <!-- Background Pulsing Ecosystem Nodes -->
  <g opacity="0.25">
    <circle cx="300" cy="340" r="6" fill="#38bdf8" class="node-pulse-3" />
    <circle cx="900" cy="340" r="6" fill="#a78bfa" class="node-pulse-1" />
    <path d="M 180 295 L 300 340 M 1020 115 L 900 340" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Dynamic Badges / Pills at Bottom (Well below title and subtitle) -->
  <g transform="translate(0, 310)" class="floating-card">
    <!-- AMQP -->
    <rect x="360" y="0" width="80" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="400" y="18" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AMQP</text>

    <!-- KAFKA -->
    <rect x="455" y="0" width="85" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="497" y="18" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">KAFKA</text>

    <!-- MQTT -->
    <rect x="555" y="0" width="80" height="28" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="595" y="18" text-anchor="middle" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MQTT</text>

    <!-- NATS -->
    <rect x="650" y="0" width="75" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="687" y="18" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">NATS</text>

    <!-- STOMP -->
    <rect x="740" y="0" width="85" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="782" y="18" text-anchor="middle" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STOMP</text>
  </g>

  <!-- FOREGROUND / PRIMARY CONTENT (Guaranteed high readability & priority) -->
  <g filter="url(#textShadow)">
    <!-- Icon / Logo Graphic -->
    <g transform="translate(600, 100)">
      <circle cx="0" cy="0" r="36" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2.5" />
      <path d="M -14 -8 L 14 -8 L 0 14 Z" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linejoin="round" />
      <circle cx="0" cy="-8" r="4" fill="#60a5fa" />
      <circle cx="-14" cy="-8" r="4" fill="#f472b6" />
      <circle cx="14" cy="-8" r="4" fill="#34d399" />
      <circle cx="0" cy="14" r="4" fill="#f59e0b" />
    </g>

    <!-- Main Title -->
    <text x="600" y="180" text-anchor="middle" fill="url(#titleGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5">
      Awesome Managed Message Broker
    </text>

    <!-- Subtitle -->
    <text x="600" y="220" text-anchor="middle" fill="url(#subGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.3">
      Cloud SaaS Platforms, Event Streaming, AMQP, MQTT, Kafka, JMS &amp; NATS
    </text>

    <!-- Feature Tagline -->
    <text x="600" y="260" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      ⚡ Curated Enterprise Messaging &amp; High-Performance Pub/Sub Architecture 🚀
    </text>
  </g>
</svg>
